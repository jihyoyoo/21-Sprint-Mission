<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>판다마켓</title>
    <link rel="icon" type="icon" href="logo.ico">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@800&family=Nanum+Gothic:wght@400;700&family=Noto+Sans+KR:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  </head>
</head>

<body>
  <main class="main signup">
    <!-- 판다마켓 로고 -->
    <a href="index.html"><img class="logo-img" src="images/logo.png" alt="로고 이미지"></a>

    <!-- 사용자 로그인 영역 -->
    <section class="user-account-container">
      <!-- 이메일 입력 영역 -->
      <div class="user-email-container">
        <label for="user-email">이메일</label>
        <input class="input-box" id="user-email" type="email" placeholder="이메일 입력">
      </div>

      <!-- 닉네임 입력 영역 -->
      <div class="user-name-container">
        <label for="user-name">닉네임</label>
        <input class="input-box" id="user-name" type="text" placeholder="닉네임 입력">
      </div>

      <!-- 비밀번호 입력 영역 -->
      <div class="user-password-container">
        <label for="user-password">비밀번호</label>
        <div class="input-wrapper">
          <input class="input-box" id="user-password" type="password" placeholder="비밀번호 입력">
          <button class="input-btn" type="button">
            <img class="input-btn-img" src="images/eye_closed.png" alt="감은 눈모양 이미지">
          </button>
        </div>
      </div>
      
      <!-- 비밀번호 확인 영역 -->
      <div class="user-password-check-container">
        <label for="user-password-check">비밀번호 확인</label>
        <div class="input-wrapper">
          <input class="input-box" id="user-password-check" type="password" placeholder="비밀번호 확인 입력">
          <button class="input-btn" type="button">
            <img class="input-btn-img" src="images/eye.png" alt="감은 눈모양 이미지">
          </button>
        </div>
      </div>

      <!-- 로그인 버튼 -->
      <a class="login-btn" href="">로그인</a>

      <!-- 간편 로그인 영역 -->
      <div class="sns-login">
        <span class="sns-text">간편 로그인하기</span>
        <div class="sns-site">
          <a href="https://www.google.com"><img class="sns-img" src="images/google.png" alt="구글 이미지"></a>
          <a href="https://www.kakaocorp.com/page"><img class="sns-img" src="images/kakao.png" alt="카카오톡 이미지"></a>
        </div>
      </div>

      <!-- 로그인 영역 -->
      <div class="log-in">
        <span class="log-in-text">이미 회원이신가요?</span>
        <a class="sign-up-btn" href="login.html">로그인</a>
      </div>
    </section>
  </main>
</body>
</html>
