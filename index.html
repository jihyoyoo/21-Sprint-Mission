<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판다마켓</title>
    <link rel="icon" type="icon" href="logo.ico">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@800&family=Nanum+Gothic:wght@400;700&family=Noto+Sans+KR:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- 헤더 영역 -->
    <header>
        <div class="container">
          <a href="index.html">
            <img class="logo" src="images/logo.png" alt="판다마켓 로고 이미지">
          </a>
          <a class="login-btn btn" href="login.html">로그인</a>
        </div>
    </header>
   
    <!-- 메인 영역 -->
    <main>
      <div class="main-container">
        <div class="main-text-content">
          <span class="main-text">
            일상의 모든 물건을<br>
            거래해 보세요
          </span>
          <a class="main-btn btn" href="items.html">구경하러 가기</a>
        </div>
      </div>   
    </main>
    
    <!-- 섹션1 -->
    <section>
      <div class="section-container">
        <div class="section1-content">
          <img class="section-img" src="images/section1.png" alt="섹션1 이미지">
          <div class="section-text-left">
            <span class="text1">Hot item</span>
            <h1 class="text2">
              인기 상품을<br>
              확인해 보세요
            </h1>
            <span class="text3">
              가장 HOT한 중고거래 물품을<br>
              판다 마켓에서 확인해 보세요
            </span>
          </div>
        </div>
      </div>
    </section>

    <!-- 섹션2 -->
    <section>
      <div class="section-container">
        <div class="section2-content">
          <div class="section-text-right">
            <span class="text1 right">Search</span>
            <h1 class="text2 right">
              구매를 원하는<br>
              상품을 검색하세요
            </h1>
            <span class="text3 right">
              구매하고 싶은 물품은 검색해서<br>
              쉽게 찾아보세요
            </span>
          </div>
          <img class="section-img" src="images/section2.png" alt="섹션2 이미지">
        </div>
      </div>
    </section>

    <!-- 섹션3 -->
    <section>
      <div class="section-container">
        <div class="section3-content">
          <img class="section-img" src="images/section3.png" alt="섹션3 이미지">
          <div class="section-text-left">
            <span class="text1">Register</span>
            <h1 class="text2">
              판매를 원하는<br>
              상품을 등록하세요
            </h1>
            <span class="text3">
              어떤 물건이든 판매하고 싶은 상품을<br>
              쉽게 등록하세요
            </span>
          </div>
        </div>
      </div>
    </section>

    <!-- 회색 빈 공간 -->
    <div class="empty-area"></div>
  
    <!-- 맨아래 영역 -->
    <main>
      <div class="main-container bottom">
        <div class="main-text-content">
          <span class="main-text">
            믿을 수 있는<br>
            판다마켓 중고거래
          </span>
        </div>
      </div>   
    </main>

    <!-- 푸터 영역 -->
    <footer>
      <div class="footer-container">
        <span>©codeit - 2024</span>
        <div class="information">
          <a href="privacy.html" class="information-text">Privacy Policy</a>
          <a href="faq.html" class="information-text">FAQ</a>
        </div>
        <div class="sns-site">
          <a href="https://www.facebook.com/" target="_blank"><img class="sns-image" src="images/facebook.png" alt="페이스북 이미지"></a> 
          <a href="https://www.twitter.com/" target="_blank"><img class="sns-image" src="images/twitter.png" alt="트위터 이미지"></a>
          <a href="https://www.youtube.com/" target="_blank"><img class="sns-image" src="images/youtube.png" alt="유튜브 이미지"></a>
          <a href="https://www.instagram.com/" target="_blank"><img class="sns-image" src="images/instagram.png" alt="인스타그램 이미지"></a>
        </div>
      </div>
    </footer>
    
  </body> 
</html>
