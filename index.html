<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판다마켓</title>
    <link rel="icon" type="icon" href="logo.ico">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@800&family=Nanum+Gothic:wght@400;700&family=Noto+Sans+KR:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- 헤더 영역 -->
    <header>
        <div class="header-container">
          <a href="index.html">
            <img class="logo" src="images/logo.png" alt="">
          </a>
          <a class="login-btn btn" href="login.html">로그인</a>
        </div>
    </header>
   
    <!-- 메인 영역 -->
    <main>
      <!-- 구경하러 가기 영역 -->
      <section class="hero">
        <div class="hero-container">
          <div class="hero-text-content">
            <span class="hero-text">
              일상의 모든 물건을<br>
              거래해 보세요
            </span>
            <a class="hero-btn btn" href="items.html">구경하러 가기</a>
          </div>
        </div>   
      </section>
    
    
      <!-- 섹션1: 인기 상품 영역 -->
      <section class="section">
        <div class="section-container">
          <div class="hot-item-content">
            <img class="content-img" src="images/section1.png" alt="">
            <div class="content-text-container left">
              <span class="content-title">Hot item</span>
              <h1 class="content-main-text">
                인기 상품을<br>
                확인해 보세요
              </h1>
              <span class="content-sub-text">
                가장 HOT한 중고거래 물품을<br>
                판다 마켓에서 확인해 보세요
              </span>
            </div>
          </div>
        </div>
      </section>

      <!-- 섹션2: 검색 영역 -->
      <section class="section">
        <div class="section-container">
          <div class="search-content">
            <div class="content-text-container-right">
              <span class="content-title right">Search</span>
              <h1 class="content-main-text right">
                구매를 원하는<br>
                상품을 검색하세요
              </h1>
              <span class="content-sub-text right">
                구매하고 싶은 물품은 검색해서<br>
                쉽게 찾아보세요
              </span>
            </div>
            <img class="content-img" src="images/section2.png" alt="">
          </div>
        </div>
      </section>

      <!-- 섹션3: 등록 영역 -->
      <section class="section">
        <div class="section-container">
          <div class="register-content">
            <img class="content-img" src="images/section3.png" alt="">
            <div class="content-text-container">
              <span class="content-title">Register</span>
              <h1 class="content-main-text">
                판매를 원하는<br>
                상품을 등록하세요
              </h1>
              <span class="content-sub-text">
                어떤 물건이든 판매하고 싶은 상품을<br>
                쉽게 등록하세요
              </span>
            </div>
          </div>
        </div>
      </section>
    
      <!-- 회색 빈 공간 -->
      <div class="empty-area"></div>
    
      <!-- 신뢰 문구 영역 -->
      <section class="trust-message-section">
        <div class="hero-container bottom">
          <div class="hero-text-content">
            <span class="hero-text">
              믿을 수 있는<br>
              판다마켓 중고거래
            </span>
          </div>
        </div>   
      </section>
    </main>

    <!-- 푸터 영역 -->
    <footer>
      <div class="footer-container">
        <span>©codeit - 2024</span>
        <div class="information">
          <a href="privacy.html" class="information-text">Privacy Policy</a>
          <a href="faq.html" class="information-text">FAQ</a>
        </div>
        <div class="sns-site">
          <a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer"><img class="sns-image" src="images/facebook.png" alt=""></a> 
          <a href="https://www.twitter.com/" target="_blank" rel="noopener noreferrer"><img class="sns-image" src="images/twitter.png" alt=""></a>
          <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer"><img class="sns-image" src="images/youtube.png" alt=""></a>
          <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer"><img class="sns-image" src="images/instagram.png" alt=""></a>
        </div>
      </div>
    </footer>
    
  </body> 
</html>
